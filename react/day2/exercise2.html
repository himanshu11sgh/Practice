<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2</title>
</head>
<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);

    function ProductDetails(props) {
      const {name, price, discount, imgSrc} = props
      return (
        <div>
          <div>
            <img src={imgSrc} alt={imgSrc} width="50"/>
          </div>
          <div>{name}</div>
          <div>{discount ? <del>Price: ${price}</del> : <>Price: ${price}</>}</div>
          {discount && <div>Discount Price: ${discount}</div>}
          <div>
            <button>Add to Cart</button>  
          </div>
        </div>
      )
    }

    function App() {
      return (
        <>
          <ProductDetails name="Cotton socks" price="10.90" discount="5.45" imgSrc="images/cotton-socks.webp"/>
          <ProductDetails name="Tennis balls" price="6.00" imgSrc="images/tennis-balls.jpeg"/>
          <ProductDetails name="T-shirt" price="7.99" imgSrc="images/t-shirt.jpg"/>
        </>
      )
    }


    root.render(<App/>)
  </script>
  
</body>
</html>
