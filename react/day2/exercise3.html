<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3</title>
  <style>
    body {
      background-color: rgb(222, 222, 222);
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .btn {
      background-color: rgb(25, 135, 84);
      padding: 10px;
      border-width: 0;
      border-radius: 8px;
      color: white;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">
    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);

    function Counter({count, setCount, elemRef}) {
      function clickHandler() {
        setCount(count + 1)
      }
      return (
        <button className="btn" onClick={clickHandler} ref={elemRef}>Clicked {count} {(count <= 1) ? 'time' : 'times'}</button>
      )
    }

    function Reset({setCount}) {
      function resetHandler() {
        setCount(0);
      }
      return (
        <button className="btn" onClick={resetHandler}> Reset </button>
      )
    }

    function AutoClick({elemRef}) {
      function autoClickHandler() {
        setInterval(() => {
          if (elemRef) {
            elemRef.current.click();
          }
        }, 1000)
      }
      return (
        <button className="btn" onClick={autoClickHandler}>Auto Click</button>
      )
    }

    function App() {
      const elemRef = React.useRef(null);
      const [count, setCount] = React.useState(0);
      return (
        <div className="container">
          <Counter count={count} setCount={setCount} elemRef={elemRef}/>
          <Reset setCount={setCount}/>
          <AutoClick elemRef={elemRef}/>
        </div>
      )
    }

    root.render(<App />)
  </script>
</body>
</html>
